<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOUL APT · 실거래가 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" crossorigin="anonymous">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" crossorigin="anonymous"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">SEOUL APT<span>실거래가 대시보드</span></div>
  <nav>
    <a href="#/overview" data-path="/overview">개요</a>
    <a href="#/compare" data-path="/compare">비교</a>
    <a href="#/explore" data-path="/explore">탐색</a>
    <a href="#/about" data-path="/about">정보</a>
  </nav>
  <div class="controls">
    <div class="segmented" id="deal-toggle">
      <button data-value="sale">매매</button>
      <button data-value="jeonse">전세</button>
      <button data-value="wolse">월세</button>
    </div>
    <select class="control" id="period-select">
      <option value="all">전체 12개월</option>
      <option value="m6">최근 6개월</option>
      <option value="m3">최근 3개월</option>
    </select>
    <div class="segmented" id="metric-toggle">
      <button data-value="ppp">평당가</button>
      <button data-value="amount">거래금액</button>
    </div>
  </div>
</header>

<main>
  <div id="app"></div>
</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
